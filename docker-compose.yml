services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bapc
      POSTGRES_PASSWORD: bapc
      POSTGRES_DB: bapc
    ports:
      - "${BAPC_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bapc"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
