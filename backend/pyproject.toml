[project]
name = "bapc-backend"
version = "0.1.0"
description = "Brownsville Adult & Pediatric Clinic — appointment scheduling backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "langchain-core>=1.0.2,<2",
    "langchain-ollama>=0.3,<1",
    "langgraph==1.0.10",
    "langgraph-checkpoint==4.0.0",
    "langgraph-prebuilt==1.0.8",
    "mcp[cli]>=1.0,<2",
    "httpx>=0.28,<1",
    "sse-starlette>=2.0,<3",
    "tzdata>=2025.1",
    "dateparser>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "pip-audit>=2.9,<3",
    "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
